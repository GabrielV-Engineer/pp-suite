component: frontend
entries:
  - id: DEBT-FE-001
    title: Title validation rules are duplicated in the form and the API
    description: SL-004 needs the same title rules in the form (for quick feedback) and in the API (for safety). Writing them twice is faster now and drifts later.
    kind: duplication
    origin:
      type: slice
      ref: SL-004
    created: 2026-10-24
    proposed_by: ai
    cost_of_delay:
      level: medium
      rationale: Every later slice that edits titles must change both copies, and one of them will be forgotten.
    trigger: Before SL-005 (edit a title) starts, which adds a third place that validates titles.
    status: scheduled
    approved_by: example-owner
    paid_by: SL-008
    also_affects: [backend]
