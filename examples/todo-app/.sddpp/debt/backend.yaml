component: backend
entries:
  - id: DEBT-BE-001
    title: The task list is returned in full, without pagination
    description: SL-002 returns every task in one response. That is fine up to the size QA-001 assumes and wasteful beyond it.
    kind: performance
    origin:
      type: slice
      ref: SL-002
    created: 2026-10-24
    proposed_by: ai
    cost_of_delay:
      level: low
      rationale: QA-001 assumes at most 1000 tasks, which a full response handles comfortably.
    trigger: When the stored task count passes 1000, or p95 latency of create-then-list exceeds 200 ms.
    status: proposed
