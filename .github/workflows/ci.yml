name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ppc/package-lock.json
      - name: Install
        working-directory: tools/ppc
        run: npm ci
      - name: Tests (validator, CLI, docs consistency)
        working-directory: tools/ppc
        run: npm test
      - name: The example validates in strict mode
        run: node tools/ppc/bin/ppc.mjs validate examples/todo-app --strict
      - name: Audits match git history (the example has none yet)
        run: node tools/ppc/bin/ppc.mjs check-git examples/todo-app

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Measuring-script tests (no dependencies)
        run: node --test "tools/eval/test/*.test.mjs"

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test-lock guard unit tests
        run: python3 -m unittest discover -s sdd-pp/extension/sddpp-guard/tests -v
      - name: Session-start hook unit tests
        run: python3 -m unittest discover -s sdd-pp/extension/sddpp-cycle/tests -v
