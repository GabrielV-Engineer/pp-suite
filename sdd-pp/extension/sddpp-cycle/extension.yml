schema_version: "1.0"

extension:
  id: "sddpp-cycle"
  name: "SDD.PP Cycle"
  version: "0.1.0"
  description: "Prompts that plan the slices from the design and drive an agent through one slice: build (light) or red and green (strict), then audit, using ppc for every transition."
  author: "GabrielV-Engineer"
  repository: "https://github.com/GabrielV-Engineer/pp-suite"
  license: "MIT"

requires:
  speckit_version: ">=1.2.0"

provides:
  commands:
    - name: "speckit.sddpp-cycle.red"
      file: "commands/red.md"
      description: "RED: write the failing tests for the slice in progress, commit them, stop for human approval"
    - name: "speckit.sddpp-cycle.slices"
      file: "commands/slices.md"
      description: "SLICES: plan thin vertical slices from the design (the person approves the list before it is written)"
    - name: "speckit.sddpp-cycle.prompts"
      file: "commands/prompts.md"
      description: "PROMPTS: prepare the system, negative and design prompts for the next task of a slice, from the project's design"
    - name: "speckit.sddpp-cycle.clarify"
      file: "commands/clarify.md"
      description: "CLARIFY: find what a planned slice or the design leaves unclear, ask up to 5 questions, and put each answer where its owner allows"
    - name: "speckit.sddpp-cycle.analyze"
      file: "commands/analyze.md"
      description: "ANALYZE: read-only review of the design and the planned slices for what ppc validate cannot see: contradictions, vague criteria, drift"
    - name: "speckit.sddpp-cycle.converge"
      file: "commands/converge.md"
      description: "CONVERGE: read-only comparison of a slice's code with what the slice promised: missing, partial, contradicts, unrequested"
    - name: "speckit.sddpp-cycle.build"
      file: "commands/build.md"
      description: "BUILD (light cycle): write the tests and the code of the slice in progress together, then audit"
    - name: "speckit.sddpp-cycle.green"
      file: "commands/green.md"
      description: "GREEN: write the least production code that passes the approved tests"
    - name: "speckit.sddpp-cycle.refactor"
      file: "commands/refactor.md"
      description: "REFACTOR: pay technical debt without changing behavior, with the tests locked"
    - name: "speckit.sddpp-cycle.audit"
      file: "commands/audit.md"
      description: "AUDIT: record debt and deviations, then close the slice with ppc finish"
